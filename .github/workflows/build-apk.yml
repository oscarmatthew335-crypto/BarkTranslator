name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      # Where opted-in clips and labels are uploaded (see server/README.md).
      # Leave unset and the app still builds; clips wait on the phone.
      EXPO_PUBLIC_PAWLINGO_API: ${{ vars.PAWLINGO_API }}
      EXPO_PUBLIC_PAWLINGO_KEY: ${{ secrets.PAWLINGO_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check upload settings
        run: |
          if [ -n "$EXPO_PUBLIC_PAWLINGO_API" ]; then echo "PAWLINGO_API is set"; else echo "::warning::PAWLINGO_API variable is not set; clips will wait on the phone"; fi
          if [ -n "$EXPO_PUBLIC_PAWLINGO_KEY" ]; then echo "PAWLINGO_KEY is set"; else echo "::warning::PAWLINGO_KEY secret is not set"; fi

      - name: Install dependencies
        run: npm install

      - name: Generate native Android folder
        run: npx expo prebuild --platform android --clean

      - name: Download Gradle from GitHub, with longer timeouts
        working-directory: ./android
        # services.gradle.org kept timing out (504 / 10 s timeout) on 8 Nov 2026,
        # while the same file on GitHub's release page downloaded fine.
        run: |
          f=gradle/wrapper/gradle-wrapper.properties
          sed -i -E 's#^distributionUrl=.*services\.gradle\.org/distributions/gradle-([0-9.]+)-(bin|all)\.zip#distributionUrl=https\\://github.com/gradle/gradle-distributions/releases/download/v\1/gradle-\1-\2.zip#' "$f"
          sed -i -E 's#^networkTimeout=.*#networkTimeout=120000#' "$f"
          grep -q '^networkTimeout=' "$f" || echo 'networkTimeout=120000' >> "$f"
          echo "systemProp.org.gradle.internal.http.connectionTimeout=120000" >> gradle.properties
          echo "systemProp.org.gradle.internal.http.socketTimeout=120000" >> gradle.properties
          echo "systemProp.org.gradle.internal.repository.max.retries=5" >> gradle.properties
          cat "$f"

      - name: Look in Google's copy of Maven Central first
        # On 8 Nov 2026 Maven Central sent kotlin-compiler-embeddable to a GitHub
        # link that kept returning 504. Google's mirror serves the same files.
        # An init script reaches every build, including the Expo and React Native
        # Gradle plugin builds.
        run: |
          d="${GRADLE_USER_HOME:-$HOME/.gradle}/init.d"
          mkdir -p "$d"
          cat > "$d/maven-central-mirror.gradle" <<'GRADLE'
          allprojects {
            repositories {
              maven {
                name = 'GoogleMavenCentralMirror'
                url = 'https://maven-central.storage-download.googleapis.com/maven2/'
                content {
                  excludeGroupByRegex 'androidx\\..*'
                  excludeGroupByRegex 'com\\.android(\\..*)?'
                  excludeGroupByRegex 'com\\.google\\.android\\..*'
                }
              }
            }
          }
          GRADLE
          cat "$d/maven-central-mirror.gradle"

      - name: Build Standalone APK
        working-directory: ./android
        # Downloads (Gradle, Kotlin compiler) sometimes time out with a 504.
        # Retry up to 4 times; finished downloads are kept between tries.
        run: |
          for attempt in 1 2 3 4; do
            if ./gradlew assembleRelease -x lint -x test; then exit 0; fi
            if [ "$attempt" -lt 4 ]; then
              echo "::warning::Build attempt $attempt failed; retrying in 120 s"
              sleep 120
            fi
          done
          exit 1

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pawlingo-APK${{ (env.EXPO_PUBLIC_PAWLINGO_API == '' && '-no-server') || '' }}${{ (env.EXPO_PUBLIC_PAWLINGO_KEY == '' && '-no-key') || '' }}
          path: android/app/build/outputs/apk/release/app-release.apk

