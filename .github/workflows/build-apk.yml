name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      # Where opted-in clips and labels are uploaded (see server/README.md).
      # Leave unset and the app still builds; clips wait on the phone.
      EXPO_PUBLIC_PAWLINGO_API: ${{ vars.PAWLINGO_API }}
      EXPO_PUBLIC_PAWLINGO_KEY: ${{ secrets.PAWLINGO_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install

      - name: Generate native Android folder
        run: npx expo prebuild --platform android --clean

      - name: Build Standalone APK
        working-directory: ./android
        run: ./gradlew assembleRelease -x lint -x test

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pawlingo-APK
          path: android/app/build/outputs/apk/release/app-release.apk

